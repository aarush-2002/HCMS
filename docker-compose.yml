version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hmcs-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hmcs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hmcs_secret}
      POSTGRES_DB: ${POSTGRES_DB:-hmcs_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hmcs} -d ${POSTGRES_DB:-hmcs_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: hmcs-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-hmcs}:${POSTGRES_PASSWORD:-hmcs_secret}@postgres:5432/${POSTGRES_DB:-hmcs_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-production-secret-replace-me-hmcs-2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:80}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      UPLOAD_DIR: /app/uploads
      RATE_LIMIT_LOGIN_MAX: 10
      RATE_LIMIT_GLOBAL_MAX: 500
    volumes:
      - uploads_data:/app/uploads

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: hmcs-web
    restart: always
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  pgdata:
  uploads_data:
